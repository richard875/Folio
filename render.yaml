services:
  - type: web
    name: folio
    runtime: node
    plan: free
    region: singapore
    buildCommand: NODE_OPTIONS=--max-old-space-size=4096 sh -c 'npm ci --include=dev && npm run lint && npm test && npm run typecheck && npm run build'
    startCommand: node --env-file-if-exists=.env scripts/start-production.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ACCESS_HASH
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=256 --max-semi-space-size=16
      - key: HOST
        value: 0.0.0.0
      - key: VITE_AUTH_ENABLED
        value: "false"
      - key: READ_CONCURRENCY
        value: "2"
        sync: false
      - key: SAVE_CONCURRENCY
        value: "2"
        sync: false
      - key: FEED_CONCURRENCY
        value: "2"
      - key: RSS_LINKS_PER_SECTION
        value: "3"
        sync: false
      - key: FETCH_RETRY_LIMIT
        value: "8"
        sync: false
      - key: NITRO_SHUTDOWN_TIMEOUT
        value: "20000"
